<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Set the theme class before first paint to avoid a flash of the wrong theme.
         Mirrors the storage key + default in src/contexts/ThemeContext.tsx. -->
    <script>
      (() => {
        try {
          const value = localStorage.getItem("bible-reader-theme");
          const stored =
            value === "dark" || value === "light" || value === "system"
              ? value
              : "dark";
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            stored === "system" ? (systemDark ? "dark" : "light") : stored;
          document.documentElement.classList.add(theme);
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <title>Bible Reader</title>

    <meta
      name="description"
      content="Read, search, save, and organize Scripture in your browser."
    />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />

    <meta property="og:title" content="Bible Reader" />
    <meta
      property="og:description"
      content="Read, search, save, and organize Scripture in your browser."
    />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
