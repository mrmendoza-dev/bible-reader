<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Set the theme class before first paint to avoid a flash of the wrong theme.
         Mirrors the storage key + default in src/contexts/ThemeContext.tsx. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("bible-reader-theme") || "dark";
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            stored === "system" ? (systemDark ? "dark" : "light") : stored;
          document.documentElement.classList.add(theme);
        } catch {
          /* localStorage unavailable — fall back to CSS default */
        }
      })();
    </script>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="content-language" content="en-us" />
    <title>Bible Reader</title>

    <meta
